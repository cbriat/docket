[package]
name = "docket"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "Mac app for associate editors and reviewers on PaperCept journal sites (PaperPlaza, IFAC)"
repository = "https://github.com/cbriat/docket"
readme = "README.md"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
encoding_rs = "0.8.44"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "cookies", "multipart", "rustls", "gzip"] }
rpassword = "7.5.4"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
wry = "0.57.1"
tao = "0.37.2"
muda = "0.21.2"
tray-icon = { version = "0.26.1", default-features = false }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSResponder", "objc2-core-foundation"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "PDFView", "PDFDocument", "objc2-app-kit"] }
